<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="manifest" href="/customer-app.webmanifest" />
    <link rel="apple-touch-icon" href="/agendoro-logo.png" />
    <title>Agendoro</title>
    <script>
      (function () {
        var theme = "dark";
        var customerAppMatch = window.location.pathname.match(/^\/c\/([^/]+)(?:\/|$)/);
        var dynamicManifestUrl = null;

        try {
          var storedTheme = window.localStorage.getItem("agendoro-theme");
          if (storedTheme === "dark" || storedTheme === "light-pastel") {
            theme = storedTheme;
          }
        } catch (error) {
          theme = "dark";
        }

        if (customerAppMatch) {
          var tenantSlug = decodeURIComponent(customerAppMatch[1]);
          var startPath = "/c/" + encodeURIComponent(tenantSlug);
          var manifest = {
            name: "Agendoro",
            short_name: "Agendoro",
            description: "App do cliente do Agendoro para acompanhar compromissos e receber lembretes.",
            start_url: startPath,
            scope: startPath,
            display: "standalone",
            background_color: "#fff7ed",
            theme_color: "#f59e0b",
            icons: [
              { src: "/agendoro-logo.png", sizes: "192x192", type: "image/png" },
              { src: "/agendoro-logo.png", sizes: "512x512", type: "image/png" }
            ]
          };

          dynamicManifestUrl = URL.createObjectURL(
            new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })
          );

          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.setAttribute("href", dynamicManifestUrl);
          }

          window.addEventListener(
            "pagehide",
            function () {
              if (dynamicManifestUrl) {
                URL.revokeObjectURL(dynamicManifestUrl);
              }
            },
            { once: true }
          );
        }

        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
