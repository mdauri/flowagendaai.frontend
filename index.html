<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="manifest" href="/customer-app.webmanifest" />
    <link rel="apple-touch-icon" href="/agendoro-logo.png" />
    <title>Agendoro</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          var storedTheme = window.localStorage.getItem("agendoro-theme");
          if (storedTheme === "dark" || storedTheme === "light-pastel") {
            theme = storedTheme;
          }
        } catch (error) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
