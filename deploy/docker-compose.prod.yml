services:
  frontend:
    image: ${AGENDORO_FRONTEND_IMAGE:?missing AGENDORO_FRONTEND_IMAGE}
    container_name: agendoro-frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.agendoro-frontend.rule=Host(`agenda.dauri.com.br`)"
      - "traefik.http.routers.agendoro-frontend.entrypoints=websecure"
      - "traefik.http.routers.agendoro-frontend.tls=true"
      - "traefik.http.routers.agendoro-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agendoro-frontend.middlewares=agendoro-frontend-security@docker"
      - "traefik.http.middlewares.agendoro-frontend-security.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.agenda.dauri.com.br; worker-src 'self' blob:"
      - "traefik.http.middlewares.agendoro-frontend-security.headers.frameDeny=true"
      - "traefik.http.middlewares.agendoro-frontend-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.agendoro-frontend-security.headers.browserXssFilter=true"
      - "traefik.http.services.agendoro-frontend.loadbalancer.server.port=80"

networks:
  web:
    external: true
