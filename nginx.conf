map $request_uri $seo_robots_header {
  default "";
  ~^/(app|manage|c|p)(/|$) "noindex, follow";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag $seo_robots_header always;

  location / {
    try_files $uri $uri/index.html =404;
  }

  # The React app remains available for known private and tenant flows.
  location ~ ^/(app|manage|c|p)(/|$) {
    try_files $uri $uri/index.html /index.html;
  }

  location /assets/ {
    try_files $uri =404;
  }
}
